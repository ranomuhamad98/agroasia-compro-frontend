name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check production secrets
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_USER_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing production secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets above to the production environment, then re-run this workflow."
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER_PATH: ${{ secrets.SSH_USER_PATH }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            BASE_PATH="${{ secrets.SSH_USER_PATH }}"
            BASE_PATH="${BASE_PATH%/}"
            DEPLOY_PATH="${BASE_PATH}/frontend"
            ENV_PATH="${BASE_PATH}/.env.frontend"
            HOST_PORT="${{ secrets.HOST_PORT }}"
            HOST_PORT="${HOST_PORT:-3000}"

            if [ ! -f "${ENV_PATH}" ]; then
              echo "ERROR: env file not found: ${ENV_PATH}"
              exit 1
            fi

            mkdir -p "${DEPLOY_PATH}/public"
            UPLOADS_PATH="${BASE_PATH}/backend/public/uploads"
            mkdir -p "${UPLOADS_PATH}"
            echo "Deploy path: ${DEPLOY_PATH}"
            echo "Public path: ${DEPLOY_PATH}/public"
            echo "Uploads path: ${UPLOADS_PATH}"
            echo "Env file: ${ENV_PATH}"

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            IMAGE_TAG="latest"

            echo "Pulling image: ${IMAGE_NAME}:${IMAGE_TAG}"
            PULL_OK=0
            for i in 1 2 3; do
              echo "Pull attempt ${i}/3..."
              if docker pull "${IMAGE_NAME}:${IMAGE_TAG}"; then
                PULL_OK=1
                break
              fi
              echo "Pull failed, retrying in 15s..."
              sleep 15
            done
            if [ "$PULL_OK" -ne 1 ]; then
              echo "Failed to pull ${IMAGE_NAME}:${IMAGE_TAG}"
              exit 1
            fi

            docker stop agroasia-compro-frontend agroasia-compro-prod || true
            docker rm agroasia-compro-frontend agroasia-compro-prod || true

            docker run -d \
              --name agroasia-compro-frontend \
              --restart unless-stopped \
              -p "${HOST_PORT}:3000" \
              --env-file "${ENV_PATH}" \
              -e NODE_ENV=production \
              -e NUXT_HOST=0.0.0.0 \
              -e NUXT_PORT=3000 \
              -e HOST_PUBLIC_DIR=/srv/public \
              -e API_UPSTREAM=http://172.17.0.1:3300/api \
              -e NUXT_PUBLIC_API_BASE=https://agroasiaberdikari.id/api \
              -v "${DEPLOY_PATH}/public:/srv/public" \
              -v "${UPLOADS_PATH}:/srv/public/uploads" \
              "${IMAGE_NAME}:${IMAGE_TAG}"

            docker image prune -f || true
            docker ps -a | grep agroasia-compro-frontend || echo "Container status check"
