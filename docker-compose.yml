version: '3.8'

services:
  # Development service
  agroasia-compro-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: agroasia-compro-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    command: npm run dev
    restart: unless-stopped
    networks:
      - agroasia-network
    profiles:
      - dev

  # Production service
  agroasia-compro-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: agroasia-compro-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    restart: unless-stopped
    networks:
      - agroasia-network
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod

  # Nginx reverse proxy for production
  agroasia-compro-nginx:
    image: nginx:alpine
    container_name: agroasia-compro-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - agroasia-compro-prod
    restart: unless-stopped
    networks:
      - agroasia-network
    mem_limit: 128m
    cpus: 0.25
    profiles:
      - prod

networks:
  agroasia-network:
    driver: bridge
